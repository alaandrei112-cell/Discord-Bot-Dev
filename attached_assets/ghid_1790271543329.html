<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loading</title>
<style>
  :root{
    --bg:#0a0707;
    --card:#150c0d;
    --border:rgba(220,90,100,.18);
    --fg:#f2eceb;
    --muted:#a89a99;
    --accent:#d9505f;
    --accent-dark:#7a2530;
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0;
    background:
      radial-gradient(circle at 20% 15%, rgba(217,80,95,.10), transparent 45%),
      radial-gradient(circle at 80% 10%, rgba(217,80,95,.08), transparent 40%),
      var(--bg);
    color:var(--fg);
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  body{
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .card{
    width:340px;
    padding:36px 32px;
    border-radius:20px;
    background:linear-gradient(180deg, rgba(255,255,255,.02), transparent), var(--card);
    border:1px solid var(--border);
    box-shadow:0 20px 60px rgba(0,0,0,.5);
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:20px;
  }
  .icon-box{
    position:relative;
    width:76px;
    height:76px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .glow{
    position:absolute;
    inset:-14px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(217,80,95,.35), transparent 70%);
    filter:blur(3px);
    animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:.5; transform:scale(.95);}
    50%{opacity:1; transform:scale(1.05);}
  }
  .ring{
    position:absolute;
    inset:0;
    border-radius:50%;
    border:3px solid transparent;
    border-top-color:var(--accent);
    border-right-color:var(--accent-dark);
    animation:spin 1.3s linear infinite;
  }
  @keyframes spin{ to{transform:rotate(360deg);} }
  svg{
    position:relative;
    z-index:1;
    width:32px;
    height:32px;
    filter:drop-shadow(0 0 6px rgba(217,80,95,.55));
    animation:breathe 2s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.08);}
  }
  .eyebrow{
    font-size:11px;
    font-weight:700;
    letter-spacing:2.5px;
    text-transform:uppercase;
    color:var(--accent);
  }
  .title{
    font-family:Georgia,'Times New Roman',serif;
    font-size:24px;
    font-weight:600;
    color:var(--fg);
    margin:0;
  }
  .label{
    font-size:13px;
    color:var(--muted);
    display:flex;
    align-items:center;
    gap:3px;
  }
  .dots span{
    animation:blink 1.4s infinite;
    opacity:0;
  }
  .dots span:nth-child(1){animation-delay:0s;}
  .dots span:nth-child(2){animation-delay:.2s;}
  .dots span:nth-child(3){animation-delay:.4s;}
  @keyframes blink{
    0%,80%,100%{opacity:0;}
    40%{opacity:1;}
  }
  .bar{
    width:100%;
    height:3px;
    border-radius:4px;
    background:rgba(255,255,255,.06);
    overflow:hidden;
  }
  .bar div{
    height:100%;
    width:35%;
    border-radius:4px;
    background:linear-gradient(90deg,var(--accent-dark),var(--accent));
    animation:slide 1.3s ease-in-out infinite;
  }
  @keyframes slide{
    0%{transform:translateX(-120%);}
    100%{transform:translateX(400%);}
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon-box">
      <div class="glow"></div>
      <div class="ring"></div>
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 5.5C4 4.67 4.67 4 5.5 4H11V20H5.5C4.67 20 4 19.33 4 18.5V5.5Z"
              stroke="url(#g)" stroke-width="1.6" stroke-linejoin="round" fill="rgba(217,80,95,0.14)"/>
        <path d="M20 5.5C20 4.67 19.33 4 18.5 4H13V20H18.5C19.33 20 20 19.33 20 18.5V5.5Z"
              stroke="url(#g)" stroke-width="1.6" stroke-linejoin="round" fill="rgba(217,80,95,0.14)"/>
        <path d="M11 4C11 4 12 5 12 7V20" stroke="url(#g)" stroke-width="1.3" stroke-linecap="round"/>
        <defs>
          <linearGradient id="g" x1="4" y1="4" x2="20" y2="20">
            <stop offset="0" stop-color="#d9505f"/>
            <stop offset="1" stop-color="#7a2530"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
    <div class="title">Se încarcă ghidul</div>
    <div class="bar"><div></div></div>
    <div class="label">Se pregătește ghidul jocului<span class="dots"><span>.</span><span>.</span><span>.</span></span></div>
  </div>
</body>
</html>
